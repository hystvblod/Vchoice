<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>VChronicles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/app.css" />

  <style>
    :root{
      --vc-bg0:#05060a;
      --vc-bg1:#090b13;
      --vc-bg2:#0b1226;
      --vc-accent:#ff3b3b;
      --vc-accent2:#b71b1b;
      --vc-text:rgba(255,255,255,.94);
      --vc-muted:rgba(255,255,255,.72);
      --vc-border:rgba(255,255,255,.10);
    }

    body.vc-crosspromo-body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(1200px 700px at 50% -120px, rgba(255,59,59,.16), transparent 60%),
        radial-gradient(900px 600px at 80% 15%, rgba(110,40,190,.10), transparent 55%),
        radial-gradient(1000px 700px at 20% 45%, rgba(18,110,140,.10), transparent 60%),
        linear-gradient(180deg, var(--vc-bg0), var(--vc-bg1) 45%, var(--vc-bg2));
      position:relative;
      overflow-x:hidden;
    }

    body.vc-crosspromo-body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
      opacity:.08;
      background-size:260px 260px;
      mix-blend-mode:overlay;
    }

    body.vc-crosspromo-body::after{
      content:"";
      position:fixed;
      inset:-60px;
      pointer-events:none;
      z-index:0;
      background:radial-gradient(circle at 50% 40%, transparent 0 42%, rgba(0,0,0,.55) 72%, rgba(0,0,0,.78) 100%);
    }

    .vc-crosspromo-shell{
      position:relative;
      z-index:1;
      width:min(980px, calc(100vw - 24px));
      margin:0 auto;
      padding:14px 0 28px;
    }

    .vc-crosspromo-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:14px;
      padding:10px 12px;
      border-radius:18px;
      background:rgba(0,0,0,.26);
      border:1px solid rgba(255,255,255,.10);
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
      box-shadow:0 10px 24px rgba(0,0,0,.24);
    }

    .vc-crosspromo-back{
      width:44px;
      height:44px;
      border:none;
      background:transparent;
      padding:0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      box-shadow:none;
      flex:0 0 44px;
      border-radius:999px;
    }

    .vc-crosspromo-back img{
      width:44px;
      height:44px;
      object-fit:contain;
      display:block;
      filter:drop-shadow(0 4px 10px rgba(0,0,0,.45));
    }

    .vc-crosspromo-title-wrap{
      flex:1 1 auto;
      min-width:0;
      text-align:center;
    }

    .vc-crosspromo-title{
      margin:0;
      color:#fff;
      font-size:22px;
      font-weight:950;
      text-shadow:
        0 2px 6px rgba(0,0,0,.58),
        0 6px 18px rgba(0,0,0,.40);
    }

    .vc-crosspromo-subtitle{
      margin:6px 0 0;
      color:var(--vc-muted);
      font-size:13px;
      line-height:1.35;
      text-shadow:
        0 2px 6px rgba(0,0,0,.54),
        0 4px 12px rgba(0,0,0,.32);
    }

    .vc-crosspromo-spacer{
      width:44px;
      height:44px;
      flex:0 0 44px;
    }

    .vc-crosspromo-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:16px;
    }

    .vc-crosspromo-card{
      position:relative;
      overflow:hidden;
      border-radius:22px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(8,10,18,.50);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      box-shadow:
        0 16px 40px rgba(0,0,0,.40),
        0 0 0 1px rgba(255,59,59,.06) inset;
    }

    .vc-crosspromo-hero{
      position:relative;
      height:172px;
      overflow:hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0)),
        radial-gradient(circle at top right, rgba(255,59,59,.16), transparent 45%),
        rgba(0,0,0,.12);
    }

    .vc-crosspromo-hero img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .vc-crosspromo-content{
      padding:12px;
      color:#fff;
    }

    .vc-crosspromo-head{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      margin-bottom:12px;
    }

    .vc-crosspromo-reward{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      padding:10px 16px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);
      font-size:15px;
      font-weight:900;
      white-space:nowrap;
      text-align:center;
      flex-shrink:0;
      margin-inline:auto;
      animation:vcRewardPulse 2.2s ease-in-out infinite;
      box-shadow:0 6px 18px rgba(0,0,0,.20);
    }

    .vc-crosspromo-reward-label{
      font-size:14px;
      font-weight:950;
      letter-spacing:.2px;
      opacity:1;
    }

    .vc-crosspromo-reward img{
      width:28px;
      height:28px;
      object-fit:contain;
      display:block;
      flex:0 0 28px;
      transform:translateY(2px);
    }

    .vc-crosspromo-reward-value{
      font-size:16px;
      font-weight:950;
    }

    @keyframes vcRewardPulse{
      0%{ transform:scale(1); opacity:1; }
      50%{ transform:scale(1.04); opacity:.88; }
      100%{ transform:scale(1); opacity:1; }
    }

    .vc-crosspromo-desc{
      margin:4px auto 14px auto;
      color:rgba(255,255,255,.94);
      font-size:14px;
      line-height:1.5;
      text-align:center;
      max-width:28ch;
      text-shadow:0 2px 8px rgba(0,0,0,.18);
    }

    .vc-crosspromo-card[data-app-id="vuniverse"] .vc-crosspromo-desc{
      max-width:44ch;
    }

    .vc-crosspromo-gallery{
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:8px;
      margin-bottom:12px;
      align-items:start;
    }

    .vc-crosspromo-shot{
      width:100%;
      aspect-ratio:9 / 16;
      border:none;
      border-radius:22px;
      overflow:hidden;
      background:transparent;
      padding:0;
      box-shadow:none;
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
      display:block;
      line-height:0;
    }

    .vc-crosspromo-shot img{
      width:100%;
      height:100%;
      display:block;
      object-fit:contain;
      object-position:center;
      border-radius:22px;
      overflow:hidden;
      background:transparent;
    }

    .vc-crosspromo-actions{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
    }

    .vc-crosspromo-btn{
      min-height:50px;
      padding:12px 14px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.10);
      color:#fff;
      font-weight:900;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    .vc-crosspromo-btn.primary{
      background:rgba(255,59,59,.20);
      border-color:rgba(255,59,59,.34);
      box-shadow:0 10px 22px rgba(0,0,0,.22);
    }

    .vc-crosspromo-btn:active{
      transform:scale(.99);
    }

    .vc-shot-viewer{
      position:fixed;
      inset:0;
      z-index:300000;
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:rgba(0,0,0,.82);
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
    }

    .vc-shot-viewer.is-open{
      display:flex;
    }

    .vc-shot-viewer-dialog{
      position:relative;
      width:min(92vw, 520px);
      max-height:90vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .vc-shot-viewer-close{
      position:absolute;
      top:-10px;
      right:-10px;
      width:42px;
      height:42px;
      border:none;
      border-radius:999px;
      background:rgba(20,28,44,.92);
      color:#fff;
      font-size:24px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 10px 24px rgba(0,0,0,.34);
      z-index:2;
    }

    .vc-shot-viewer-img{
      width:100%;
      max-height:90vh;
      object-fit:contain;
      display:block;
      border-radius:22px;
      background:transparent;
      box-shadow:0 18px 40px rgba(0,0,0,.35);
    }

    @media (min-width: 860px){
      .vc-crosspromo-grid{
        grid-template-columns:1fr 1fr;
      }

      .vc-crosspromo-hero{
        height:200px;
      }
    }

    @media (max-width: 520px){
      .vc-crosspromo-shell{
        width:min(100vw - 18px, 980px);
        padding:10px 0 22px;
      }

      .vc-crosspromo-title{
        font-size:20px;
      }

      .vc-crosspromo-hero{
        height:156px;
      }

      .vc-crosspromo-top{
        padding:8px 10px;
      }

      .vc-crosspromo-reward{
        padding:9px 14px;
      }

      .vc-crosspromo-reward-label{
        font-size:13px;
      }

      .vc-crosspromo-reward-value{
        font-size:15px;
      }

      .vc-crosspromo-reward img{
        width:28px;
        height:28px;
        flex:0 0 28px;
        transform:translateY(2px);
      }
    }
  </style>
</head>

<body class="vc-crosspromo-body">
  <main class="vc-crosspromo-shell">
    <div class="vc-crosspromo-top">
      <a
        class="vc-crosspromo-back"
        href="index.html"
        aria-label="Retour"
        data-i18n-aria="ui.aria_back"
      >
        <img src="assets/img/ui/btn_home.webp" alt="" draggable="false" />
      </a>

      <div class="vc-crosspromo-title-wrap">
        <h1 class="vc-crosspromo-title" data-i18n="crosspromo.page_title">Découvre les autres jeux</h1>
        <p class="vc-crosspromo-subtitle" data-i18n="crosspromo.page_subtitle">
          Installe les autres apps du studio et récupère ta récompense.
        </p>
      </div>

      <div class="vc-crosspromo-spacer" aria-hidden="true"></div>
    </div>

    <section class="vc-crosspromo-card">
      <div class="vc-crosspromo-content">
        <div class="vc-crosspromo-head">
          <div class="vc-crosspromo-reward">
            <span class="vc-crosspromo-reward-label" data-i18n="referral.crosspromo_reward_label"></span>
            <img src="assets/img/ui/vcoin.webp" alt="" />
            <span class="vc-crosspromo-reward-value">+ 200</span>
          </div>
        </div>

        <div class="vc-crosspromo-desc" data-i18n="referral.crosspromo_desc"></div>

        <div class="vc-crosspromo-actions">
          <button
            class="vc-crosspromo-btn primary"
            id="cp_invite_btn"
            type="button"
            data-i18n="referral.invite_and_earn_btn"
          ></button>
        </div>
      </div>
    </section>

    <section class="vc-crosspromo-grid" id="vc-crosspromo-grid"></section>
  </main>

  <div class="vc-shot-viewer" id="vc-shot-viewer" aria-hidden="true">
    <div class="vc-shot-viewer-dialog">
      <button class="vc-shot-viewer-close" id="vc-shot-viewer-close" type="button" aria-label="Fermer">×</button>
      <img class="vc-shot-viewer-img" id="vc-shot-viewer-img" src="" alt="" />
    </div>
  </div>

  <script src="js/supabase.min.js"></script>
  <script src="js/supabaseBootstrap.js"></script>
  <script src="js/userData.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/purchases.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/crossPromo.js"></script>
  <script src="js/referral.js"></script>
</body>
</html>
