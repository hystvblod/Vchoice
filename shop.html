<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>VChoice</title>
  <link rel="stylesheet" href="css/app.css" />

  <style>
    .topbar{ display:none !important; }

    :root{
      --vc-bg0:#05060a;
      --vc-bg1:#090b13;
      --vc-bg2:#0b1226;

      --vc-accent:#ff3b3b;
      --vc-accent2:#b71b1b;

      --vc-card-r:20px;
      --vc-border:rgba(255,255,255,.10);
      --vc-border2:rgba(255,255,255,.14);

      --vc-text:rgba(255,255,255,.94);
      --vc-muted:rgba(255,255,255,.68);

      --vc-glow: 0 18px 40px rgba(0,0,0,.45);
      --vc-soft: 0 10px 24px rgba(0,0,0,.25);
    }

    html.shop-modal-open, body.shop-modal-open{
      overflow: hidden;
      touch-action: none;
    }

    html,
    body{
      margin:0;
      padding:0;
      height:auto;
      min-height:100%;
    }

    html{
      background:#101426;
    }

    body{
      min-height:100dvh;
      position:relative;
      overflow-x:hidden;
      background:none;
      isolation:isolate;
    }

    body::before{
      content:"";
      position:absolute;
      top:0;
      left:0;
      right:0;
      bottom:0;
      pointer-events:none;
      z-index:0;
      background:
        linear-gradient(
          180deg,
          #101426 0%,
          #11203a 14%,
          #15305a 30%,
          #183765 46%,
          #1b3a66 58%,
          #213861 70%,
          #29355a 82%,
          #312f54 92%,
          #382a4d 100%
        );
      background-repeat:no-repeat;
    }

    body::after{
      content:none;
      display:none;
    }

    .page{
      position:relative;
      z-index:1;
      padding: 12px 14px 26px;
    }

    .vc-top-actions{
      position: relative;
      z-index: 10;
      width: 100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      padding: calc(10px + env(safe-area-inset-top)) 12px 8px;
    }

    .vc-top-slot{
      flex: 1 1 0;
      display:flex;
      align-items:center;
    }

    .vc-top-left{ justify-content:flex-start; }
    .vc-top-center{ justify-content:center; }
    .vc-top-right{ justify-content:flex-end; }

    .vc-icon-button{
      width:44px;
      height:44px;
      border-radius:999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.26);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: var(--vc-soft);
      padding:0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      text-decoration:none;
      -webkit-tap-highlight-color: transparent;
    }

    .vc-icon-button:active{
      transform: scale(.98);
    }

    .vc-icon-button img{
      width:30px;
      height:30px;
      object-fit:contain;
      display:block;
      pointer-events:none;
      user-select:none;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,0.7)) contrast(1.15) brightness(1.08);
    }

    .vc-back-ico{
      width:22px;
      height:22px;
      display:block;
      opacity:.98;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,0.75));
      pointer-events:none;
      user-select:none;
    }

.shop-head{
  padding: 16px 2px 10px;
  text-align:center;
}

.shop-title-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap: 10px;
  width:100%;
  opacity: .95;
}

.shop-title-line{
  height: 1px;
  flex: 1 1 auto;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent);
}

.shop-title{
  margin: 0;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: rgba(255,255,255,.78);
  text-shadow: 0 10px 22px rgba(0,0,0,.55);
  white-space: nowrap;
  line-height: 1;
  min-height: auto;
}

    .reward-grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 10px 0 14px;
    }

    @media (max-width: 360px){
      .reward-grid{ gap: 10px; }
      .shop-title-line{ max-width: 54px; }
      .shop-title{ font-size: 18px; }
    }

    .shop-panel{
      border-radius: var(--vc-card-r);
      border: 1px solid var(--vc-border);
      background: rgba(0,0,0,0.22);
      box-shadow: var(--vc-glow);
      overflow:hidden;
      position: relative;
    }

    .reward-card{
      padding: 12px 12px 12px;
      cursor: default;
      -webkit-tap-highlight-color: transparent;
    }

    .reward-card::before{
      content:"";
      position:absolute;
      inset:-1px;
      pointer-events:none;
      background:
        radial-gradient(420px 180px at 20% 15%, rgba(255,59,59,.18), transparent 60%),
        radial-gradient(420px 220px at 75% 20%, rgba(110,40,190,.12), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.05), transparent 40%);
      opacity:.9;
    }

    .reward-top{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 10px;
      min-height: 74px;
    }

    .reward-ico{
      width: 72px;
      height: 72px;
      object-fit: contain;
      filter: drop-shadow(0 16px 30px rgba(0,0,0,.55));
      flex: 0 0 auto;
      user-select:none;
      pointer-events:none;
    }

    .reward-x{
      flex: 1 1 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 950;
      font-size: 20px;
      letter-spacing: .2px;
      color: var(--vc-text);
      opacity: .98;
      text-shadow: 0 10px 22px rgba(0,0,0,.45);
      line-height: 1;
      text-align:center;
      padding-right: 0;
    }

    .reward-btn{
      position:relative;
      width:100%;
      border-radius: 14px;
      padding: 11px 10px;
      font-weight: 950;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.28);
      color: var(--vc-text);
      cursor:pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,.22);
      min-height: 42px;
    }

    .reward-btn:active{
      transform: translateY(1px);
    }

    .reward-btn.is-busy{
      opacity:.7;
      cursor:not-allowed;
    }

    .shop-divider{
      margin: 26px 2px 20px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 10px;
      opacity: .95;
    }

    .shop-divider-line{
      height: 1px;
      flex: 1 1 auto;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent);
    }

    .shop-divider-title{
      margin: 0;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(255,255,255,.78);
      text-shadow: 0 10px 22px rgba(0,0,0,.55);
      white-space: nowrap;
    }

    .shop-section{
      margin-top: 0;
    }

    .shop-grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .prod-card{
      padding: 12px 12px 12px;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
      position:relative;
      transition: transform .12s ease;
    }

    .prod-card:active{
      transform: scale(.99);
    }

    .prod-card::before{
      content:"";
      position:absolute;
      inset:-1px;
      pointer-events:none;
      background:
        radial-gradient(360px 220px at 18% 10%, rgba(255,59,59,.14), transparent 62%),
        radial-gradient(360px 220px at 80% 12%, rgba(18,110,140,.10), transparent 62%),
        linear-gradient(180deg, rgba(255,255,255,.05), transparent 48%);
      opacity: .92;
    }

    .prod-inner{
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:stretch;
      justify-content:space-between;
      gap: 10px;
      min-height: 0;
    }

    .prod-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      min-height: 74px;
      width:100%;
    }

    .prod-ico{
      width: 72px;
      height: 72px;
      object-fit: contain;
      filter: drop-shadow(0 18px 34px rgba(0,0,0,.60));
      user-select:none;
      pointer-events:none;
      flex: 0 0 auto;
    }

    .prod-amount{
      flex: 1 1 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 950;
      font-size: 20px;
      color: var(--vc-text);
      text-shadow: 0 10px 24px rgba(0,0,0,.5);
      line-height: 1.1;
      min-height: 22px;
      text-align:center;
      padding-right: 0;
    }

    .prod-card[data-product="vchoice_no_ads"],
    .prod-card[data-product="vchoice_ultra"]{
      padding-top: 14px;
      padding-bottom: 14px;
    }

    .prod-card[data-product="vchoice_no_ads"] .prod-inner,
    .prod-card[data-product="vchoice_ultra"] .prod-inner{
      gap: 10px;
    }

    .prod-card[data-product="vchoice_no_ads"] .prod-top,
    .prod-card[data-product="vchoice_ultra"] .prod-top{
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      min-height: 116px;
    }

    .prod-card[data-product="vchoice_no_ads"] .prod-amount,
    .prod-card[data-product="vchoice_ultra"] .prod-amount{
      display: flex;
      flex: 0 0 auto;
      width: 100%;
      align-items: center;
      justify-content: center;
      font-size: 15px !important;
      font-weight: 950;
      line-height: 1.08;
      min-height: 20px;
      max-width: none;
      text-align: center;
      padding: 0;
      letter-spacing: .01em;
      color: var(--vc-text);
      text-shadow: 0 10px 24px rgba(0,0,0,.45);
    }

    .prod-card[data-product="vchoice_no_ads"] .prod-note,
    .prod-card[data-product="vchoice_ultra"] .prod-note{
      display: block;
      width: 100%;
      margin: -2px auto 2px;
      max-width: 15ch;
      min-height: 30px;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.22;
      text-align: center;
      color: rgba(255,255,255,.82);
      text-shadow: 0 8px 18px rgba(0,0,0,.38);
    }

    .prod-card[data-product="vchoice_no_ads"] .prod-ico{
      margin: 0 auto;
      width: 74px;
      height: 74px;
    }

    .prod-card[data-product="vchoice_ultra"] .prod-ico{
      margin: 0 auto;
      width: 92px;
      height: 92px;
      filter:
        drop-shadow(0 0 12px rgba(185,230,255,.34))
        drop-shadow(0 0 28px rgba(185,230,255,.20))
        drop-shadow(0 16px 30px rgba(0,0,0,.45));
      transform-origin: center;
      animation: vcDiamondPulse 1.9s ease-in-out infinite;
    }

    @keyframes vcDiamondPulse{
      0%,100%{
        transform: scale(1);
      }
      50%{
        transform: scale(1.10);
      }
    }

    .prod-price{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 11px 10px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      font-weight: 950;
      font-size: 15px;
      letter-spacing: .2px;
      box-shadow: 0 10px 20px rgba(0,0,0,.20);
      color: var(--vc-text);
      min-height: 42px;
    }

    .prod-card.is-owned .prod-price{
      border-color: rgba(80,220,140,.25);
      background: rgba(15,50,28,.25);
    }

    .owned-badge{
      position:absolute;
      top: 10px;
      right: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(80,220,140,.30);
      background: rgba(10,40,22,.35);
      color: rgba(235,255,244,.95);
      font-weight: 950;
      font-size: 12px;
      letter-spacing: .02em;
      box-shadow: 0 12px 24px rgba(0,0,0,.25);
      display:none;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      min-height: 24px;
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    .prod-card.is-owned .owned-badge{
      display:inline-flex;
    }

    .shop-modal{
      position: fixed;
      inset: 0;
      z-index: 999;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px 14px;
      background: rgba(0,0,0,.62);
      opacity: 0;
      pointer-events:none;
      transition: opacity .14s ease;
    }

    .shop-modal.is-open{
      opacity: 1;
      pointer-events:auto;
    }

    .shop-modal-card{
      width: min(520px, 100%);
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.14);
      background:
        radial-gradient(900px 420px at 20% 0%, rgba(255,59,59,.16), transparent 60%),
        radial-gradient(900px 420px at 90% 5%, rgba(110,40,190,.12), transparent 60%),
        rgba(8,10,16,.92);
      box-shadow: 0 26px 70px rgba(0,0,0,.70);
      overflow:hidden;
      transform: scale(.98) translateY(6px);
      transition: transform .16s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .shop-modal.is-open .shop-modal-card{
      transform: scale(1) translateY(0);
    }

    .shop-modal-top{
      padding: 18px 16px 10px;
      display:flex;
      flex-direction:column;
      gap: 10px;
      align-items:center;
      text-align:center;
    }

    .shop-modal-ico{
      width: 86px;
      height: 86px;
      object-fit: contain;
      filter: drop-shadow(0 18px 34px rgba(0,0,0,.60));
      flex: 0 0 auto;
      user-select:none;
      pointer-events:none;
    }

    .shop-modal-title{
      margin: 0;
      font-size: 20px;
      font-weight: 950;
      color: var(--vc-text);
      line-height: 1.1;
      text-shadow: 0 10px 24px rgba(0,0,0,.55);
      min-height: 22px;
    }

    .shop-modal-price{
      font-weight: 950;
      font-size: 20px;
      letter-spacing: .2px;
      color: var(--vc-text);
      white-space: nowrap;
      margin-top: 2px;
      min-height: 22px;
      text-align:center;
    }

    .shop-modal-desc{
      margin: 8px 16px 0;
      color: var(--vc-muted);
      font-size: 13px;
      line-height: 1.35;
      text-align:center;
      min-height: 18px;
    }

    .shop-modal-bottom{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap: 12px;
      padding: 14px 16px 16px;
      margin-top: 12px;
      border-top: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.22);
    }

    .shop-modal-actions{
      display:flex;
      gap: 10px;
      align-items:center;
      justify-content:center;
      width:100%;
    }

    .shop-modal-btn{
      border-radius: 14px;
      padding: 11px 14px;
      font-weight: 950;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      color: var(--vc-text);
      cursor:pointer;
      min-width: 132px;
      min-height: 44px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    .shop-modal-btn:active{
      transform: translateY(1px);
    }

    .shop-modal-btn.primary{
      border-color: rgba(255,59,59,.30);
      background: linear-gradient(180deg, rgba(255,59,59,.20), rgba(0,0,0,.16));
      box-shadow: 0 14px 30px rgba(0,0,0,.30);
    }

    .shop-modal-btn[disabled]{
      opacity:.6;
      cursor:not-allowed;
    }

@media (min-width: 768px) and (max-width: 1366px){
  .page{
    padding: 18px 22px 34px;
  }

  .vc-top-actions{
    gap:16px;
    padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
  }

  .vc-icon-button{
    width:58px;
    height:58px;
  }

  .vc-icon-button img{
    width:38px;
    height:38px;
  }

  .vc-back-ico{
    width:30px;
    height:30px;
  }

  .shop-head{
    padding: 24px 4px 16px;
  }

  .shop-title,
  .shop-divider-title{
    font-size:18px;
  }

  .reward-grid,
  .shop-grid{
    gap:18px;
  }

  .reward-card,
  .prod-card{
    padding:18px;
  }

  .reward-top,
  .prod-top{
    min-height:94px;
  }

  .reward-ico,
  .prod-ico{
    width:92px;
    height:92px;
  }

  .prod-card[data-product="vchoice_no_ads"] .prod-ico{
    width:96px;
    height:96px;
  }

  .prod-card[data-product="vchoice_ultra"] .prod-ico{
    width:116px;
    height:116px;
  }

  .reward-x,
  .prod-amount,
  .shop-modal-title,
  .shop-modal-price{
    font-size:28px;
  }

  .prod-card[data-product="vchoice_no_ads"] .prod-amount,
  .prod-card[data-product="vchoice_ultra"] .prod-amount{
    font-size:22px !important;
  }

  .prod-card[data-product="vchoice_no_ads"] .prod-note,
  .prod-card[data-product="vchoice_ultra"] .prod-note{
    max-width:18ch;
    min-height:44px;
    font-size:15px;
    line-height:1.3;
  }

  .reward-btn,
  .prod-price,
  .shop-modal-btn{
    min-height:56px;
    font-size:18px;
    border-radius:16px;
  }

  .owned-badge{
    top:14px;
    right:14px;
    font-size:14px;
    padding:8px 12px;
  }

  .shop-modal{
    padding: 24px 20px;
  }

  .shop-modal-card{
    width:min(680px, 92vw);
  }

  .shop-modal-top{
    padding: 24px 22px 14px;
  }

  .shop-modal-ico{
    width:104px;
    height:104px;
  }

  .shop-modal-desc{
    margin: 10px 20px 0;
    font-size:17px;
    line-height:1.5;
  }

  .shop-modal-bottom{
    padding: 18px 20px 20px;
  }
}


.book-grid{
  display:grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.book-card{
  padding: 12px;
  cursor: default;
  -webkit-tap-highlight-color: transparent;
  position:relative;
}

.book-card::before{
  content:"";
  position:absolute;
  inset:-1px;
  pointer-events:none;
  background:
    radial-gradient(360px 220px at 18% 10%, rgba(255,59,59,.14), transparent 62%),
    radial-gradient(360px 220px at 80% 12%, rgba(18,110,140,.10), transparent 62%),
    linear-gradient(180deg, rgba(255,255,255,.05), transparent 48%);
  opacity: .92;
}

.book-inner{
  position:relative;
  display:flex;
  flex-direction:column;
  gap: 10px;
  align-items:stretch;
}

.book-cover-btn{
  border:0;
  padding:0;
  margin:0;
  background:transparent;
  cursor:pointer;
  border-radius: 16px;
  overflow:hidden;
  box-shadow: 0 16px 32px rgba(0,0,0,.38);
}

.book-cover{
  width:100%;
  aspect-ratio: 2 / 3;
  object-fit:cover;
  display:block;
  user-select:none;
  pointer-events:none;
}

.book-title{
  min-height: 34px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color: var(--vc-text);
  font-size: 14px;
  font-weight: 950;
  line-height: 1.18;
  text-shadow: 0 10px 22px rgba(0,0,0,.45);
}

.book-buy-btn{
  width:100%;
  border-radius: 14px;
  padding: 11px 10px;
  font-weight: 950;
  border: 1px solid rgba(255,59,59,.30);
  background: linear-gradient(180deg, rgba(255,59,59,.20), rgba(0,0,0,.16));
  color: var(--vc-text);
  cursor:pointer;
  box-shadow: 0 10px 20px rgba(0,0,0,.22);
  min-height: 42px;
}

.book-buy-btn:active{
  transform: translateY(1px);
}

.book-modal-cover{
  width:min(210px, 70vw);
  aspect-ratio: 2 / 3;
  object-fit:cover;
  border-radius: 16px;
  box-shadow: 0 18px 42px rgba(0,0,0,.55);
}

.book-country-note{
  margin: 0;
  color: rgba(255,255,255,.58);
  font-size: 12px;
  line-height: 1.35;
  text-align:center;
}

.book-market-btn{
  margin-top: 8px;
  width:100%;
  border-radius: 14px;
  padding: 10px 12px;
  border: 1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.07);
  color: var(--vc-text);
  font-weight: 900;
  cursor:pointer;
}

.book-market-list{
  display:flex;
  flex-direction:column;
  gap: 8px;
  width:100%;
  margin-top: 12px;
}

.book-market-option{
  width:100%;
  border-radius: 14px;
  padding: 12px 12px;
  border: 1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.07);
  color: var(--vc-text);
  font-weight: 900;
  text-align:left;
  cursor:pointer;
}

.book-market-option.is-active{
  border-color: rgba(255,59,59,.55);
  background: rgba(255,59,59,.18);
}
