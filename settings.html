<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title></title>
  <link rel="stylesheet" href="css/app.css" />

  <style>
    html,
    body{
      height:100%;
    }

    body.page-settings{
      margin:0;
      width:100%;
      min-height:100dvh;
      overflow-x:hidden;
      overflow-y:auto;
      overscroll-behavior-y:auto;
      display:block;
    }

    /* ===== TOPBAR (comme index, mais flèche + profil) ===== */
    .topbar{ display:none !important; }

    .vc-top-actions{
      position: relative;
      z-index: 10;
      width: 100%;
      flex: 0 0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      padding: calc(10px + env(safe-area-inset-top)) 12px 8px;
      box-sizing:border-box;
    }

    .vc-top-slot{
      flex: 1 1 0;
      display:flex;
      align-items:center;
    }
    .vc-top-left{ justify-content:flex-start; }
    .vc-top-center{ justify-content:center; }
    .vc-top-right{ justify-content:flex-end; }

    .vc-icon-button{
      width:44px;
      height:44px;
      border-radius:999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.26);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 10px 22px rgba(0,0,0,0.22);
      padding:0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      text-decoration:none;
      -webkit-tap-highlight-color: transparent;
      flex: 0 0 auto;
    }

    .vc-icon-button:active{ transform: scale(.98); }

    .vc-icon-button img{
      width:30px;
      height:30px;
      object-fit:contain;
      display:block;
      pointer-events:none;
      user-select:none;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.65)) contrast(1.15) brightness(1.08);
    }

    .vc-back-ico{
      width:24px;
      height:24px;
      display:block;
      opacity:.98;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.65));
    }

    body.page-settings .app{
      min-height:0;
      display:block;
      overflow:visible;
    }

    body.page-settings .main{
      display:block;
      padding: 0 12px max(18px, calc(18px + env(safe-area-inset-bottom)));
      box-sizing:border-box;
      overflow:visible;
    }

    body.page-settings .panel{
      display:block;
      overflow:visible;
    }

    body.page-settings .panel__head{
      flex: 0 0 auto;
      padding-left: calc(16px + env(safe-area-inset-left));
      padding-right: calc(16px + env(safe-area-inset-right));
    }

    body.page-settings .panel__body{
      display:block;
      justify-content:flex-start;
      overflow:visible;
      padding-left: calc(16px + env(safe-area-inset-left));
      padding-right: calc(16px + env(safe-area-inset-right));
      padding-bottom: max(18px, calc(18px + env(safe-area-inset-bottom)));
      box-sizing:border-box;
    }

    /* ====== PANEL HEAD centré ====== */
    .panel__headCentered{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      gap:6px;
      padding-top:2px;
    }

    .panel__headCentered .title{
      margin:0;
      text-align:center;
      width:100%;
    }

    .panel__headCentered .muted{
      margin:0;
      text-align:center;
      max-width: 520px;
    }

    /* ====== Grille langues ======
       ✅ au moins 3 drapeaux par ligne
       ✅ plus d’espace sous le titre + plus d’espace avant les sections textes
    */
    .langGrid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:8px;
      margin-top: 14px;
      margin-bottom: 14px;
      flex: 0 0 auto;
    }

    @media (min-width: 520px){
      .langGrid{ grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    /* ✅ BOUTONS LANGUES SANS “CARRÉ” */
    .langBtn{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      gap:7px;
      padding:10px 4px 8px;
      border-radius:14px;
      border:0 !important;
      background:transparent !important;
      box-shadow:none !important;
      color:inherit;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
      text-align:center;
    }

    .langBtn:active{
      transform: scale(.98);
    }

    .langBtn.isActive{
      outline:0;
      box-shadow: 0 0 0 2px rgba(255,255,255,.22), 0 14px 34px rgba(0,0,0,.26) !important;
      background:transparent !important;
      border:0 !important;
    }

    .flag{
      width:46px;
      height:32px;
      border-radius:8px;
      overflow:hidden;
      border:0 !important;
      outline:0 !important;
      box-shadow:none !important;
      background:transparent !important;
      flex:0 0 auto;
    }

    .flag svg{
      width:100%;
      height:100%;
      display:block;
    }

    .langText{
      display:block !important;
      width:100%;
      min-height:24px;
      font-size:10px;
      font-weight:800;
      line-height:1.15;
      color:rgba(255,255,255,.96);
      text-align:center;
      white-space:normal;
      word-break:break-word;
    }

    .langCode,
    .langName{
      display:none !important;
    }

    /* ====== Sections ====== */
    .settingsSection{
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,.10);
      flex: 0 0 auto;
    }

    .settingsSectionTitle{
      font-weight: 950;
      font-size: 13px;
      letter-spacing: .2px;
      opacity: .92;
      margin: 0 0 8px 0;
    }

    /* ✅ enlever les “carrés” autour du bloc pubs */
    .toggleRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 6px 0;
      border-radius: 0;
      border: 0;
      background: transparent;
    }

    .toggleText{ min-width:0; }

    .toggleLabel{
      font-weight: 950;
      line-height: 1.2;
      margin:0;
    }

    .toggleDesc{
      margin:4px 0 0 0;
      opacity: .78;
      font-size: 12px;
      line-height: 1.25;
    }

    .privacyBtn{
      min-height:38px;
      padding:0 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.08);
      color:#fff;
      font-weight:900;
      cursor:pointer;
      flex:0 0 auto;
    }

    .switch{
      position: relative;
      width: 54px;
      height: 32px;
      flex: 0 0 auto;
    }

    .switch input{
      position:absolute;
      inset:0;
      opacity:0;
      width:100%;
      height:100%;
      margin:0;
      cursor:pointer;
    }

    .switchUi{
      position:absolute;
      inset:0;
      border-radius: 999px;
      background: rgba(0,0,0,.28);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 10px 22px rgba(0,0,0,0.18);
      transition: .18s ease;
    }

    .switchUi::after{
      content:"";
      position:absolute;
      top: 4px;
      left: 4px;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 10px 18px rgba(0,0,0,.22);
      transition: .18s ease;
    }

    .switch input:checked + .switchUi{
      background: rgba(255,255,255,.14);
      border-color: rgba(255,255,255,.22);
      box-shadow: 0 10px 22px rgba(0,0,0,0.18), 0 0 0 1px rgba(255,59,59,.12) inset;
    }

    .switch input:checked + .switchUi::after{
      transform: translateX(22px);
    }

    .vc-inlineBtn{
      appearance:none;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.10);
      color:#fff;
      border-radius:14px;
      padding:10px 14px;
      font-weight:900;
      font-size:13px;
      line-height:1;
      cursor:pointer;
      box-shadow: 0 10px 22px rgba(0,0,0,.18);
      flex:0 0 auto;
    }

    .vc-inlineBtn:active{
      transform:scale(.99);
    }

    /* ====== Aide / email ======
       ✅ centré
       ✅ pas de carré
    */
    .vc-navRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 8px 0;
      text-decoration:none;
      color:inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .vc-navRow:active{
      transform: scale(.99);
    }

    .vc-navText{
      min-width:0;
    }

    .vc-navLabel{
      margin:0;
      font-weight:950;
      line-height:1.2;
    }

    .vc-navDesc{
      margin:4px 0 0 0;
      opacity:.78;
      font-size:12px;
      line-height:1.25;
    }

    .vc-navArrow{
      flex:0 0 auto;
      font-size:24px;
      line-height:1;
      opacity:.72;
    }

    #settingsHelpTitle{
      text-align:center;
      width:100%;
    }

    .helpLine{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding: 6px 0;
      border-radius: 0;
      border: 0;
      background: transparent;
      margin-top:8px;
      overflow:hidden;
      text-align:center;
    }

    .helpLabel{
      font-weight: 950;
      opacity:.92;
    }

    .helpMail{
      opacity:.86;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 100%;
    }

    #settingsAdsTitle{
      text-align:center;
      width:100%;
    }

    #settingsMsg{
      flex: 0 0 auto;
      margin-top:8px !important;
      min-height: 18px;
      text-align:center;
    }

@media (min-width: 768px) and (max-width: 1366px){
  .vc-top-actions{
    gap:16px;
    padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
  }

  .vc-icon-button{
    width:58px;
    height:58px;
  }

  .vc-icon-button img{
    width:38px;
    height:38px;
  }

  .vc-back-ico{
    width:30px;
    height:30px;
  }

  body.page-settings .main{
    padding: 0 22px 22px;
  }

  body.page-settings .panel__head{
    padding-left: calc(22px + env(safe-area-inset-left));
    padding-right: calc(22px + env(safe-area-inset-right));
  }

  body.page-settings .panel__body{
    padding-left: calc(22px + env(safe-area-inset-left));
    padding-right: calc(22px + env(safe-area-inset-right));
  }

  .panel__headCentered{
    gap:10px;
    padding-top:8px;
  }

  .panel__headCentered .title{
    font-size:30px;
  }

  .panel__headCentered .muted{
    max-width:760px;
    font-size:18px;
    line-height:1.6;
  }

  .langGrid{
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap:14px;
    margin-top:22px;
    margin-bottom:22px;
  }

  .langBtn{
    min-height:64px;
    padding:12px 10px;
    border-radius:18px;
  }

  .flag{
    width:62px;
    height:44px;
    border-radius:10px;
  }

  .settingsSection{
    margin-top:18px;
    padding-top:16px;
  }

  .settingsSectionTitle{
    font-size:20px;
    margin-bottom:12px;
  }

  .toggleRow{
    gap:18px;
    padding:10px 0;
  }

  .vc-navRow{
    gap:18px;
    padding:10px 0;
  }

  .toggleLabel{
    font-size:19px;
  }

  .vc-navLabel{
    font-size:19px;
  }

  .toggleDesc{
    font-size:16px;
    line-height:1.45;
  }

  .vc-navDesc{
    font-size:16px;
    line-height:1.45;
  }

  .vc-navArrow{
    font-size:30px;
  }

  .switch{
    width:66px;
    height:38px;
  }

  .switchUi::after{
    top:4px;
    left:4px;
    width:28px;
    height:28px;
  }

  .switch input:checked + .switchUi::after{
    transform: translateX(28px);
  }

  .vc-inlineBtn{
    padding:12px 18px;
    font-size:16px;
    border-radius:16px;
  }

  .helpLine,
  .dangerLine,
  .versionLine,
  .creditsLine{
    font-size:17px;
    line-height:1.5;
  }
}

  <script>
  (async () => {
    const LangStorageKey = "vchoice_lang";
    const LANGS = [
      { code:"en",      ui:"EN",      nameKey:"ui.lang_name.en",      label:"English" },
      { code:"fr",      ui:"FR",      nameKey:"ui.lang_name.fr",      label:"Français" },
      { code:"de",      ui:"DE",      nameKey:"ui.lang_name.de",      label:"Deutsch" },
      { code:"es",      ui:"ES",      nameKey:"ui.lang_name.es",      label:"Español" },
      { code:"eslatam", ui:"ESLATAM", nameKey:"ui.lang_name.eslatam", label:"Español LATAM" },
      { code:"pt",      ui:"PT",      nameKey:"ui.lang_name.pt",      label:"Português" },
      { code:"ptbr",    ui:"PTBR",    nameKey:"ui.lang_name.ptbr",    label:"Português BR" },
      { code:"it",      ui:"IT",      nameKey:"ui.lang_name.it",      label:"Italiano" },
      { code:"ko",      ui:"KO",      nameKey:"ui.lang_name.ko",      label:"한국어" },
      { code:"ja",      ui:"JP",      nameKey:"ui.lang_name.ja",      label:"日本語" },
      { code:"id",      ui:"ID",      nameKey:"ui.lang_name.id",      label:"Bahasa Indonesia" }
    ];

    function $(id){ return document.getElementById(id); }
    function safeLower(x){ return String(x||"").trim().toLowerCase(); }

    function normalizeLang(raw){
      if(!raw) return null;
      const s = safeLower(raw);
      const map = {
        "es-us":"eslatam","es_us":"eslatam",
        "es-419":"eslatam","es_419":"eslatam",
        "eslatam":"eslatam",
        "pt-br":"ptbr","pt_br":"ptbr",
        "pt-pt":"pt","pt_pt":"pt",
        "jp":"ja","ja-jp":"ja",
        "kr":"ko","ko-kr":"ko",
        "in":"id","id-id":"id"
      };
      if(map[s]) return map[s];
      const base = s.split(/[-_]/)[0];
      if(base === "es" && (s.includes("419") || s.includes("latam") || s.includes("us"))) return "eslatam";
      if(base === "pt" && (s.includes("br") || s.includes("ptbr"))) return "ptbr";
      if(base === "ja") return "ja";
      if(base === "ko") return "ko";
      if(base === "in") return "id";
      return base || null;
    }

    function supported(code){
      const c = normalizeLang(code);
      return LANGS.some(x => x.code === c);
    }

    function getStoredLang(){
      try{
        const v = normalizeLang(localStorage.getItem(LangStorageKey));
        if(v && supported(v)) return v;
      }catch(_){}
      return null;
    }

    function detectDeviceLang(){
      const list = Array.isArray(navigator.languages) && navigator.languages.length
        ? navigator.languages
        : [navigator.language];
      for(const cand of list){
        const base = normalizeLang(cand);
        if(base && supported(base)) return base;
      }
      return "en";
    }

    function t(key, fallback){
      try{
        if(window.VRI18n && typeof window.VRI18n.t === "function"){
          const v = window.VRI18n.t(key);
          if(v) return v;
        }
      }catch(_){}
      return fallback || "";
    }

    const FLAGS = {
      fr: `<svg viewBox="0 0 30 20" aria-hidden="true"><rect width="10" height="20" x="0" y="0" fill="#1f4fbf"/><rect width="10" height="20" x="10" y="0" fill="#ffffff"/><rect width="10" height="20" x="20" y="0" fill="#d11f2e"/></svg>`,
      en: `<svg viewBox="0 0 30 20" aria-hidden="true">
  <rect width="30" height="20" fill="#fff"/>
  <g fill="#b22234">
    <rect y="0" width="30" height="1.538"/>
    <rect y="3.076" width="30" height="1.538"/>
    <rect y="6.152" width="30" height="1.538"/>
    <rect y="9.228" width="30" height="1.538"/>
    <rect y="12.304" width="30" height="1.538"/>
    <rect y="15.38" width="30" height="1.538"/>
    <rect y="18.456" width="30" height="1.544"/>
  </g>

    function renderTexts(){
      const elTitle = $("settingsTitle");
      const elDesc  = $("settingsLangDesc");
      if(elTitle) elTitle.textContent = t("ui.settings_title", "Settings");
      if(elDesc)  elDesc.textContent  = t("ui.settings_lang_desc", "Choisis la langue. Elle est sauvegardée sur l’appareil et sur ton profil.");

      document.title = t("ui.settings_title", "Settings");

      const back = $("btnBackHome");
      const cross = $("btnGoCrosspromo");
      const prof = $("btnGoProfile");

      if(back) back.setAttribute("aria-label", t("ui.settings_back_home_aria", "Back to home"));
      if(cross) cross.setAttribute("aria-label", t("crosspromo.open_page_aria", "Découvrir les autres jeux"));
      if(prof) prof.setAttribute("aria-label", t("ui.settings_open_profile_aria", "Open profile"));

      const grid = $("settingsLangGrid");
      if(grid) grid.setAttribute("aria-label", t("ui.language", "Language"));

      const adsTitle = $("settingsAdsTitle");
      const adsLabel = $("adsLabel");
      const adsDesc  = $("adsDesc");
      const adsBtn   = $("btnPrivacyOptions");

      if(adsTitle) adsTitle.textContent = t("ui.settings_ads_title", "Ads");
      if(adsLabel) adsLabel.textContent = t("ui.settings_privacy_options_label", "Privacy choices");
      if(adsDesc)  adsDesc.textContent  = t("ui.settings_privacy_options_desc", "Open Google's form to review or change your ad choices.");
      if(adsBtn){
        adsBtn.textContent = t("ui.settings_privacy_options_button", "Open");
        adsBtn.setAttribute("aria-label", t("ui.settings_privacy_options_label", "Privacy choices"));
      }

      const helpTitle = $("settingsHelpTitle");
      const helpLab   = $("helpEmailLabel");
      const helpVal   = $("helpEmailValue");

      if(helpTitle) helpTitle.textContent = t("ui.settings_help_title", "Help");
      if(helpLab)   helpLab.textContent   = t("ui.settings_help_email_label", "Contact:");
      if(helpVal)   helpVal.textContent   = t("ui.settings_help_email", "help.vboldstudio@gmail.com");

      const faqTitle = $("settingsFaqTitle");
      const faqBtn   = $("btnOpenFaq");
      const faqLabel = $("settingsFaqLabel");
      const faqDesc  = $("settingsFaqDesc");

      if(faqTitle) faqTitle.textContent = t("ui.settings_faq_title", "");
      if(faqBtn)   faqBtn.setAttribute("aria-label", t("ui.settings_open_faq_aria", ""));
      if(faqLabel) faqLabel.textContent = t("ui.settings_faq_label", "");
      if(faqDesc)  faqDesc.textContent  = t("ui.settings_faq_desc", "");

      const remoteFaqTitle = $("settingsRemoteFaqTitle");
      const remoteFaqQ1    = $("settingsRemoteFaqQ1");
      const remoteFaqA1    = $("settingsRemoteFaqA1");
      const remoteFaqQ2    = $("settingsRemoteFaqQ2");
      const remoteFaqA2    = $("settingsRemoteFaqA2");

      if(remoteFaqTitle) remoteFaqTitle.textContent = t("ui.settings_remote_faq_title", "Premium scenarios");
      if(remoteFaqQ1)    remoteFaqQ1.textContent    = t("ui.settings_remote_faq_q1", "");
      if(remoteFaqA1)    remoteFaqA1.textContent    = t("ui.settings_remote_faq_a1", "");
      if(remoteFaqQ2)    remoteFaqQ2.textContent    = t("ui.settings_remote_faq_q2", "");
      if(remoteFaqA2)    remoteFaqA2.textContent    = t("ui.settings_remote_faq_a2", "");
    }

    function buildGrid(){
      const grid = $("settingsLangGrid");
      if(!grid) return;

      grid.innerHTML = "";
      const cur = getStoredLang() || detectDeviceLang();
      const active = supported(cur) ? cur : "en";

      for(const L of LANGS){
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "langBtn" + ((active === L.code) ? " isActive" : "");
        btn.setAttribute("data-lang", L.code);

        const flag = document.createElement("div");
        flag.className = "flag";
        flag.innerHTML = FLAGS[L.code] || FLAGS.en;

        const txt = document.createElement("div");
        txt.className = "langText";
        txt.textContent = L.label || t(L.nameKey) || L.ui;

        btn.appendChild(flag);
        btn.appendChild(txt);

        const visibleLabel = L.label || t(L.nameKey) || L.ui;
        const ariaTpl = t("ui.settings_choose_lang_aria", "Choose language: {code}");
        btn.setAttribute("aria-label", ariaTpl ? ariaTpl.replace("{code}", visibleLabel) : visibleLabel);

        btn.addEventListener("click", () => setLanguage(L.code, { showMsg:true }));
        grid.appendChild(btn);
      }
    }

    function markActive(code){
      document.querySelectorAll(".langBtn[data-lang]").forEach((b) => {
        b.classList.toggle("isActive", b.getAttribute("data-lang") === code);
      });
    }

    async function setLanguage(raw, opts = {}){
      const code = normalizeLang(raw) || "en";
      const safe = supported(code) ? code : "en";

      try{ localStorage.setItem("vchoice_lang", safe); }catch(_){}
      try{ localStorage.setItem("VREALMS_LANG", safe); }catch(_){}

      try{
        if(window.VUserData && typeof window.VUserData.save === "function"){
          window.VUserData.save({ lang: safe }, { silent:true });
        }
      }catch(_){}

      let remoteOk = true;
      try{
        if(window.VUserData && typeof window.VUserData.setLang === "function"){
          remoteOk = !!(await window.VUserData.setLang(safe));
        } else if(window.VCRemoteStore && typeof window.VCRemoteStore.setLang === "function"){
          remoteOk = !!(await window.VCRemoteStore.setLang(safe));
        }
      }catch(_){ remoteOk = false; }

      try{
        if(window.VRI18n && typeof window.VRI18n.initI18n === "function"){
          await window.VRI18n.initI18n(safe);
        }
      }catch(_){}

      renderTexts();
      buildGrid();
      markActive(safe);

      const msg = $("settingsMsg");
      if(msg && opts.showMsg){
        msg.textContent = remoteOk
          ? t("ui.settings_msg_saved", "Langue enregistrée.")
          : t("ui.settings_msg_saved_local", "Langue enregistrée sur l’appareil. Synchronisation serveur plus tard.");
      }
    }

    async function openPrivacyOptions(){
      let ok = false;

      try{
        ok = !!(await window.VAds?.openGooglePrivacyOptionsForm?.());
      }catch(_){}

      const msg = $("settingsMsg");
      if(msg){
        msg.textContent = ok
          ? t("ui.settings_privacy_options_opened", "Privacy options opened.")
          : t("ui.settings_privacy_options_unavailable", "No privacy options are available right now.");
      }
    }

    try { await window.bootstrapAuthAndProfile?.(); } catch(e) {}
    try { await window.VUserData?.init?.(); } catch(e) {}
    try { await window.VRI18n?.initI18n?.(); } catch(e) {}

    try{
      const cur = getStoredLang();
      if(!cur){
        const d = detectDeviceLang();
        localStorage.setItem(LangStorageKey, d);
        localStorage.setItem("VREALMS_LANG", d);
      }
    }catch(_){}

    renderTexts();
    buildGrid();

    await setLanguage(getStoredLang() || detectDeviceLang(), { showMsg:false });

    const adsBtn = $("btnPrivacyOptions");
    if(adsBtn){
      adsBtn.addEventListener("click", () => {
        void openPrivacyOptions();
      });
    }
  })();
  </script>
